<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Gesture Recognition</title>
    <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
</head>
<body>
    <div id="liveView" class="videoView">
        <video id="webcam" autoplay playsinline></video>
        <canvas class="output_canvas" id="output_canvas" width="1280" height="720" style="position: absolute; left: 0px; top: 0px;"></canvas>
    </div>
    <script type="module">
        import { GestureRecognizer, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        let gestureRecognizer;
        let webcamRunning = false;

        const initializeRecognizer = async () => {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO"
            });
        };
        initializeRecognizer();

        // Function to start the webcam and recognition
        const startRecognition = async () => {
            if (webcamRunning) return;
            webcamRunning = true;

            const constraints = { video: true };
            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            });
        };

        // Function to process webcam frames
        async function predictWebcam() {
            const nowInMs = Date.now();
            const results = await gestureRecognizer.recognizeForVideo(video, nowInMs);

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            const drawingUtils = new DrawingUtils(canvasCtx);

            if (results.landmarks) {
                for (const landmarks of results.landmarks) {
                    drawingUtils.drawConnectors(landmarks, GestureRecognizer.HAND_CONNECTIONS, { color: "#00FF00", lineWidth: 5 });
                    drawingUtils.drawLandmarks(landmarks, { color: "#FF0000", lineWidth: 2 });
                }
            }

            if (results.gestures.length > 0) {
                const categoryName = results.gestures[0][0].categoryName;
                const categoryScore = parseFloat(results.gestures[0][0].score * 100).toFixed(2);
                const handedness = results.handednesses[0][0].displayName;

                // Send the gesture data back to React Native app
                window.ReactNativeWebView.postMessage(JSON.stringify({ 
                    gesture: categoryName, 
                    confidence: categoryScore, 
                    handedness 
                }));
            }

            if (webcamRunning) {
                window.requestAnimationFrame(predictWebcam);
            }
        }

        // Listen for messages from the React Native app
        window.addEventListener("message", (event) => {
            const message = event.data;

            if (message === "startRecognition") {
                startRecognition();
            }
        });
    </script>
</body>
</html>
