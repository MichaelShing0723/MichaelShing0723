<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Gesture Recognition</title>
    <link
      href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
    <style>
      #debugger {
        margin-top: 20px;
        padding: 10px;
        background-color: #f0f0f0;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      #debugger p {
        margin: 5px 0;
        font-size: 14px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <section id="demos" class="invisible">    
      <div id="output">Transcription will appear here...</div>
      <div id="liveView" class="videoView">
        <button id="webcamButton" class="mdc-button mdc-button--raised">
          <span class="mdc-button__ripple"></span>
          <span class="mdc-button__label">ENABLE WEBCAM</span>
        </button>
        <div style="position: relative">
          <video id="webcam" autoplay playsinline></video>
          <canvas
            class="output_canvas"
            id="output_canvas"
            width="200"
            height="200"
            style="
              position: absolute;
              left: 0px;
              top: 0px;
              background-color: aqua;
            "
          ></canvas>
          <p id="gesture_output" class="output"></p>
        </div>
      </div>
    </section>
    
    <div id="debugger">
      <h3>Debug Messages</h3>
    </div>
   
    <script type="module">
      import {
        GestureRecognizer,
        FilesetResolver,
        DrawingUtils,
      } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

      const demosSection = document.getElementById("demos");
      const debugContainer = document.getElementById("debugger");
      let gestureRecognizer;
      let runningMode = "IMAGE";
      let enableWebcamButton;
      let webcamRunning = false;
      const videoHeight = "360px";
      const videoWidth = "480px";

      // Helper function for adding debug messages
      const debugMessage = (message) => {
        const p = document.createElement("p");
        p.textContent = message;
        debugContainer.appendChild(p);
        console.log(message); // Also log to the console for developers
      };
      const outputDiv = document.getElementById("output");
      const recognition = new (window.SpeechRecognition ||
        window.webkitSpeechRecognition)();
      
      recognition.lang = "en-US"; // Set the language
      recognition.interimResults = true; // Show intermediate results
      recognition.continuous = true; // Keep listening continuously

      // Handle speech recognition results
      recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript + " ";
        }
        outputDiv.innerText = `Transcript: ${transcript}`;
        console.log(`Transcript: ${transcript}`);

        // Send data back to React Native WebView
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(
            JSON.stringify({
              message: "STT",
              data: transcript,
            })
          );
        }
      };

      // Handle errors
      recognition.onerror = (event) => {
        console.error("Error:", event.error);
      };

      // Automatically restart recognition when it stops
      recognition.onend = () => {
        console.log("Speech recognition stopped, restarting...");
        recognition.start();
      };

      const createGestureRecognizer = async () => {
        debugMessage("Initializing GestureRecognizer...");
        try {
          const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
          );
          gestureRecognizer = await GestureRecognizer.createFromOptions(
            vision,
            {
              baseOptions: {
                modelAssetPath:
                  "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                delegate: "GPU",
              },
              runningMode: runningMode,
            }
          );
          debugMessage("GestureRecognizer initialized successfully.");
          demosSection.classList.remove("invisible");
        } catch (error) {
          debugMessage(
            "Error initializing GestureRecognizer: " + error.message
          );
          console.error(error);
        }
      };
      createGestureRecognizer();

      const video = document.getElementById("webcam");
      const canvasElement = document.getElementById("output_canvas");
      const canvasCtx = canvasElement.getContext("2d");
      const gestureOutput = document.getElementById("gesture_output");

      function hasGetUserMedia() {
        return !!(
          navigator.mediaDevices && navigator.mediaDevices.getUserMedia
        );
      }

      if (hasGetUserMedia()) {
        debugMessage("getUserMedia() is supported by your browser.");
        enableWebcamButton = document.getElementById("webcamButton");
        enableWebcamButton.addEventListener("click", enableCam);
      } else {
        debugMessage("getUserMedia() is not supported by your browser.");
        console.warn("getUserMedia() is not supported by your browser.");
      }

      function enableCam(event) {
        debugMessage("Enable webcam button clicked.");
        if (!gestureRecognizer) {
          alert("Please wait for gestureRecognizer to load");
          debugMessage("GestureRecognizer not loaded yet.");
          return;
        }
        if (webcamRunning === true) {
          debugMessage("Stopping webcam.");
          webcamRunning = false;
          enableWebcamButton.innerText = "ENABLE PREDICTIONS";
        } else {
          debugMessage("Starting webcam.");
          webcamRunning = true;
          enableWebcamButton.innerText = "DISABLE PREDICTIONS";
        }

        const constraints = { video: true };
        navigator.mediaDevices
          .getUserMedia(constraints)
          .then(function (stream) {
            video.srcObject = stream;
            video.addEventListener("loadeddata", predictWebcam);
            debugMessage("Webcam stream started successfully.");
          })
          .catch((error) => {
            debugMessage("Error accessing webcam: " + error.message);
            console.error(error);
          });
      }

      let lastVideoTime = -1;
      let results = undefined;

      async function predictWebcam() {
        const webcamElement = document.getElementById("webcam");
        if (runningMode === "IMAGE") {
          runningMode = "VIDEO";
          await gestureRecognizer.setOptions({ runningMode: "VIDEO" });
        }
        let nowInMs = Date.now();
        if (video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          results = gestureRecognizer.recognizeForVideo(video, nowInMs);
        }
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        const drawingUtils = new DrawingUtils(canvasCtx);
        canvasElement.style.height = videoHeight;
        webcamElement.style.height = videoHeight;
        canvasElement.style.width = videoWidth;
        webcamElement.style.width = videoWidth;

        if (results.landmarks) {
          debugMessage("Drawing landmarks...");
          for (const landmarks of results.landmarks) {
            drawingUtils.drawConnectors(
              landmarks,
              GestureRecognizer.HAND_CONNECTIONS,
              {
                color: "#00FF00",
                lineWidth: 5,
              }
            );
            drawingUtils.drawLandmarks(landmarks, {
              color: "#FF0000",
              lineWidth: 2,
            });
          }
        }
        canvasCtx.restore();

        if (results.gestures.length > 0) {
          const categoryName = results.gestures[0][0].categoryName;
          const categoryScore = parseFloat(
            results.gestures[0][0].score * 100
          ).toFixed(2);
          const handedness = results.handednesses[0][0].displayName;

          debugMessage(
            `Gesture detected: ${categoryName} (${categoryScore}% confidence, ${handedness})`
          );

          if (window.ReactNativeWebView === undefined) {
            console.log(
              "window.ReactNativeWebView is not defined. Please run this code in a WebView."
            );
          } else {
            window.ReactNativeWebView.postMessage(
              JSON.stringify({
                message: "gesture",
                data: {
                  gesture: categoryName,
                  confidence: categoryScore,
                  handedness: handedness,
                },
              })
            );
          }

          gestureOutput.style.display = "block";
          gestureOutput.style.width = videoWidth;
          gestureOutput.innerText = `GestureRecognizer: ${categoryName}\n Confidence: ${categoryScore} %\n Handedness: ${handedness}`;
        } else {
          debugMessage("No gestures detected.");
          gestureOutput.style.display = "none";
        }

        if (webcamRunning === true) {
          window.requestAnimationFrame(predictWebcam);
        }
      }

      window.addEventListener("message", (event) => {
        const message = event.data;

        if (message === "startRecognition") {
          enableCam();
        } else if (message === "stopRecognition") {
          enableCam();
        } else if (message === "startSTT") {
          recognition.start();
        }
      });
    </script>
  </body>
</html>
